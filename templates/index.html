<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dabo Academy Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
    <style>
        :root {
            --primary-color: #4CAF50; /* Vert principal */
            --dark-bg: #1B2E1F; /* Fond sombre vert foncé */
            --card-bg: #294D33; /* Carte verte foncée */
            --text-light: #F0FDF4; /* Texte clair */
            --text-dark: #0F2612;
            --error-color: #FF6B6B;
            --quick-btn-bg: #3E7E4D;
            --input-bg: #1F3827;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-light);
            min-height: 100vh;
        }

        .logo {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            cursor: pointer;
            z-index: 1000;
        }

        .chat-container {
            position: fixed;
            right: 20px;
            bottom: 20px;
            width: 400px;
            height: 75vh;
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 999;
        }

        .chat-container.active {
            display: flex;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .chat-header {
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.05);
            text-align: center;
            border-bottom: 1px solid #3E7E4D;
        }

        .chat-header h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 10px;
            background-color: rgba(255, 255, 255, 0.03);
        }

        .quick-btn {
            flex: 1;
            padding: 10px;
            background-color: var(--quick-btn-bg);
            color: var(--text-light);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .quick-btn:hover {
            background-color: var(--primary-color);
        }

        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .user-message, .bot-message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.5;
        }

        .user-message {
            align-self: flex-end;
            background-color: var(--primary-color);
            color: var(--text-light);
        }

        .bot-message {
            align-self: flex-start;
            background-color: var(--quick-btn-bg);
        }

        .chat-input {
            display: flex;
            padding: 12px;
            border-top: 1px solid #3E7E4D;
            background-color: rgba(255, 255, 255, 0.05);
        }

        .chat-input input {
            flex: 1;
            padding: 10px 14px;
            border: none;
            border-radius: 20px;
            background-color: var(--input-bg);
            color: var(--text-light);
        }

        .chat-input button {
            margin-left: 10px;
            padding: 10px;
            border-radius: 50%;
            background-color: var(--primary-color);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .chat-input button ion-icon {
            font-size: 20px;
            color: white;
        }
    </style>
</head>
<body>
    <img class="logo" src="/static/logo.png" alt="Logo Dabo Academy">

    <div class="chat-container" id="chat-container">
        <button class="close-btn" aria-label="Fermer">✕</button>
        <div class="chat-header">
            <h1>Assistant Dabo Academy</h1>
        </div>
        <div class="quick-actions">
            <button class="quick-btn" data-question="Quels produits propose Dabo Academy ?">Produits</button>
            <button class="quick-btn" data-question="Comment contacter Dabo Academy ?">Contact</button>
            <button class="quick-btn" data-question="Comment commander un produit ?">Commande</button>
            <button class="quick-btn" data-question="Lien vers les vidéos ?">vidéos</button>
        </div>
        <div class="chat-messages" id="chat-messages">
            <div class="bot-message">Bonjour ! Je suis l’assistant de Dabo Academy. Posez une question ou utilisez les boutons ci-dessus !</div>
        </div>
        <div class="chat-input">
            <input type="text" id="user-input" placeholder="Posez votre question...">
            <button id="send-btn"><ion-icon name="send"></ion-icon></button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const logo = document.querySelector('.logo');
        const closeBtn = document.querySelector('.close-btn');
        const chatMessages = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const quickBtns = document.querySelectorAll('.quick-btn');

        logo.onclick = () => chatContainer.classList.toggle('active');
        closeBtn.onclick = () => chatContainer.classList.remove('active');

        quickBtns.forEach(btn => {
            btn.addEventListener('click', () => sendMessage(btn.dataset.question));
        });

        sendBtn.addEventListener('click', () => sendMessage(userInput.value));

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage(userInput.value);
        });

        async function sendMessage(message) {
            if (!message.trim()) return;
            appendMessage(message, true);
            userInput.value = '';

            const botMsg = document.createElement('div');
            botMsg.className = 'bot-message';
            botMsg.textContent = '...';
            chatMessages.appendChild(botMsg);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });

                const data = await res.json();
                botMsg.remove();
                appendMessage(data.response, false);
            } catch (e) {
                botMsg.remove();
                appendMessage("Erreur de connexion. Veuillez réessayer.", false);
            }
        }

        function appendMessage(msg, isUser) {
            const el = document.createElement('div');
            el.className = isUser ? 'user-message' : 'bot-message';
            el.textContent = msg;
            chatMessages.appendChild(el);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    </script>
</body>
</html>
